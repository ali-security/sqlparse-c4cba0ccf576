name: seal-build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install pinned build backend (release-era setuptools, wheel 0.34.2)
        run: python -m pip install build setuptools==45.2.0 wheel==0.34.2
      - name: Build sdist and wheel
        run: python -m build --no-isolation
      - name: List dist
        run: ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
